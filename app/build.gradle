plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.pofocus'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personal.pofocus'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // One fixed key, so updates install over the old app and the phone and
    // watch apps are allowed to talk to each other.
    signingConfigs {
        pofocus {
            storeFile rootProject.file('pofocus.keystore')
            storePassword 'pofocus123'
            keyAlias 'pofocus'
            keyPassword 'pofocus123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pofocus
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.pofocus
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}

dependencies {
    // Watch connection (settings sync with the PoFocus watch app)
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
